name: Build diagnostic IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the file logger
        run: python3 -m unittest discover -s tests -v
      - name: Build the unsigned IPA
        run: bash Amethyst/buildipa.sh
      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Amethyst-diagnostic-build
          path: |
            Amethyst/build/*.ipa
            Amethyst/build/*.log
            Amethyst/build/build-info.txt
            Amethyst/build/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
