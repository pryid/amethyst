name: Build diagnostic IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test the file logger
        run: python3 -m unittest discover -s tests -v
      - name: Build the unsigned IPA
        run: bash Amethyst/buildipa.sh
      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Amethyst-diagnostic-build
          path: |
            Amethyst/build/*.ipa
            Amethyst/build/*.log
            Amethyst/build/build-info.txt
            Amethyst/build/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
